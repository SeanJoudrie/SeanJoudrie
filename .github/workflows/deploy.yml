name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'portfolio/**'
      - 'algorithm-builder/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; let in-progress runs finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portfolio
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            portfolio/package-lock.json
            algorithm-builder/package-lock.json

      - run: npm ci
      - run: npm run build

      # Algorithm Builder ships inside the same Pages site at
      # /SeanJoudrie/algorithm-builder/. Its build uses a relative base, and
      # with no search server on Pages the playlist uses YouTube search links.
      - name: Build Algorithm Builder
        working-directory: algorithm-builder
        env:
          VITE_SEARCH_API: 'off'
        run: |
          npm ci
          npm test
          npm run build
      - run: cp -r ../algorithm-builder/dist dist/algorithm-builder

      - uses: actions/upload-pages-artifact@v3
        with:
          path: portfolio/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # Pages publish occasionally exceeds the 10-min default and aborts
          # with "Timeout reached, aborting!"; give it more headroom.
          timeout: 900000
