name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'portfolio/**'
      - 'algorithm-builder/**'
      - 'launch-check/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
  # Weekly rebuild so Algorithm Builder's "good channel" videos stay fresh.
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; let in-progress runs finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portfolio
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            portfolio/package-lock.json
            algorithm-builder/package-lock.json

      - run: npm ci
      - run: npm run build

      # Algorithm Builder ships inside the same Pages site at
      # /SeanJoudrie/algorithm-builder/. Its build uses a relative base, and
      # with no search server on Pages the playlist uses YouTube search links.
      - name: Build Algorithm Builder
        working-directory: algorithm-builder
        env:
          VITE_SEARCH_API: 'off'
        run: |
          npm ci
          # Latest uploads from its good channels (public feeds, no key).
          # Never fails the build: a channel that can't be read keeps its
          # last saved videos.
          node scripts/feeds.mjs || echo "Feed refresh skipped; using saved videos."
          npm test
          npm run build
      - run: cp -r ../algorithm-builder/dist dist/algorithm-builder

      # Launch Check is plain HTML/CSS/JS with no build step; it ships at
      # /SeanJoudrie/launch-check/.
      - name: Add Launch Check
        run: |
          mkdir -p dist/launch-check
          cp ../launch-check/index.html ../launch-check/styles.css ../launch-check/app.js ../launch-check/motion.js ../launch-check/data.js ../launch-check/config.js ../launch-check/favicon.svg ../launch-check/og.png dist/launch-check/
          # Stamp asset links with the commit so browsers never pair a new
          # page with a cached old script.
          sed -i "s/?v=dev/?v=${GITHUB_SHA::7}/g" dist/launch-check/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: portfolio/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # Pages publish occasionally exceeds the 10-min default and aborts
          # with "Timeout reached, aborting!"; give it more headroom.
          timeout: 900000
